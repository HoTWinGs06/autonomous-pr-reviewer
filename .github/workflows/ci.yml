name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest pytest-asyncio

      - name: Run tests
        run: pytest tests/ -v

      - name: Lint Python files
        run: flake8 app tests --max-line-length=100

  container:
    name: Build container
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Build Docker image
        run: docker build --tag autonomous-pr-reviewer:ci .
      - name: Inspect image configuration
        run: |
          test "$(docker image inspect autonomous-pr-reviewer:ci --format '{{.Config.User}}')" = "appuser"
          test "$(docker image inspect autonomous-pr-reviewer:ci --format '{{.Config.Healthcheck}}' | grep -c Health)" -ge 1
